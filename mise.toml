[tasks."docker:ignore-verify"]
alias = "div"
description = "Build an ephemeral Docker image with .dockerignore and verify that only the expected files land in the build context"
run = '''
#!/usr/bin/env bash

set -eou pipefail

if ! docker buildx version &>/dev/null; then
    echo "dockerignore-verify: Docker buildx is not available -- skipping." >&2
    exit 0
fi

# Create an ephemeral Dockerfile that lists every file in the build context.
TMPFILE=$(mktemp /tmp/comply-dockerignore-test-XXXXXXXXXX.Dockerfile)
trap 'rm -f "$TMPFILE"' EXIT

cat > "$TMPFILE" << 'DOCKERFILE'
FROM busybox:latest
WORKDIR /ctx
COPY . .
RUN find /ctx -type f | sort | tee /tmp/files.txt
CMD ["cat", "/tmp/files.txt"]
DOCKERFILE

TAG="comply-dockerignore-verify"

echo "--- Building ephemeral image (buildx + .dockerignore) ---"
if ! docker buildx build \
    --file "$TMPFILE" \
    --load \
    --tag "$TAG" \
    . 2>&1; then
    echo "ERROR: docker buildx build failed." >&2
    exit 1
fi

echo ""
echo "--- Files in build context (after .dockerignore) ---"
CONTEXT_FILES=$(docker run --rm "$TAG" 2>&1)
echo "$CONTEXT_FILES"

echo ""
echo "--- Verifying .dockerignore ---"

# Expected: essential build files MUST be present
for f in "Cargo.toml" "Cargo.lock" "build.rs" "rust-toolchain.toml"; do
    if echo "$CONTEXT_FILES" | grep -q "/ctx/$f"; then
        echo "  [ok]   $f present"
    else
        echo "  [FAIL] $f MISSING from build context!"
        FAIL=1
    fi
done

# Check that key directories exist
for d in "crates/comply/src/lib.rs" "crates/comply-cli/src/main.rs" ".cargo/config.toml"; do
    if echo "$CONTEXT_FILES" | grep -q "/ctx/$d"; then
        echo "  [ok]   $d present"
    else
        echo "  [FAIL] $d MISSING from build context!"
        FAIL=1
    fi
done

# Excluded directories: these MUST be absent from context root
for pat in "target" ".git" "docs" "scripts" "tests" "worktrees" ".DS_Store" "__pycache__" ".idea" ".vscode" "supply-chain" ".github" ".rumdl_cache"; do
    if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/$pat(/|$)"; then
        echo "  [FAIL] $pat should have been EXCLUDED by .dockerignore!"
        FAIL=1
    else
        echo "  [ok]   $pat excluded"
    fi
done

# Root-level excluded files
for f in "AGENTS.md" "instructions.md" "CHANGELOG.md" "deny.toml" "hk.pkl" "cobertura.xml" "lcov.info" "results.sarif" "REUSE.toml" "mise.toml" "rustfmt.toml" ".clippy.toml"; do
    if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/$f$"; then
        echo "  [FAIL] $f should have been EXCLUDED by .dockerignore!"
        FAIL=1
    else
        echo "  [ok]   $f excluded"
    fi
done

# Subdirectory .md files: **/*.md must exclude things like crates/*/README.md
if echo "$CONTEXT_FILES" | grep -Eq "^/ctx/crates/[^/]+/README\.md$"; then
    echo "  [FAIL] crates/*/README.md should have been EXCLUDED by **/*.md!"
    FAIL=1
else
    echo "  [ok]   crates/*/README.md excluded via **/*.md"
fi

echo ""
if [ -n "${FAIL:-}" ]; then
    echo "FAIL: .dockerignore verification failed."
    docker image rm "$TAG" > /dev/null 2>&1 || true
    exit 1
fi

echo "PASS: .dockerignore is correctly filtering the build context."
docker image rm "$TAG" > /dev/null 2>&1 || true
'''
shell = "bash -c"

[tasks."docker:build"]
alias = ["docker-build", "db", "dkr-b", "dkr:build"]
description = "Build a Docker image using multi-stage Dockerfile with buildx"
run = '''
#!/usr/bin/env bash
set -eou pipefail

RUST_VERSION=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml 2>/dev/null \
  || grep -oP 'rust-version\s*=\s*"\K[^"]+' Cargo.toml 2>/dev/null \
  || echo "1.97")
APP_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' Cargo.toml 2>/dev/null || echo "0.1.0")

IMAGE_TAG="${RUST_VERSION}-trixie"
DOCKER_TAG="${usage_tag:-comply:${APP_VERSION}}"
DOCKERFILE="${usage_file:-Dockerfile}"

BUILD_ARGS=()
eval "extra_args=(${usage_build_arg:-})"
for arg in "${extra_args[@]}"; do
  BUILD_ARGS+=("--build-arg" "$arg")
done

docker buildx build \
  --pull \
  --build-arg "IMAGE_TAG=${IMAGE_TAG}" \
  "${BUILD_ARGS[@]}" \
  -f "$DOCKERFILE" \
  -t "$DOCKER_TAG" \
  --progress plain \
  .
'''
shell = "bash -c"
usage = '''
flag "-b --build-arg <build_arg>" help="Additional build arg values" var=#true
flag "-t --tag <tag>" help="Docker image tag override"
flag "-f --file <file>" help="Dockerfile path override" default="Dockerfile"
'''

[tasks."actions:cancel"]
alias = ["cancel-actions", "cancel-ci"]
description = "Cancel all in-progress/queued GitHub Actions workflows for this repo"
hide = true
run = '''
#!/usr/bin/env bash

set -eou pipefail

repo=$(gh repo view --json nameWithOwner --jq '.nameWithOwner')

ids=$(gh run list --repo "${repo}" --limit 100 --json databaseId,status \
  --jq '.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting") | .databaseId')

if [[ -z "${ids}" ]]; then
  echo "No running workflows to cancel."
  exit 0
fi

echo "${ids}" | while IFS= read -r id; do
  echo "Cancelling run ${id}..."
  gh run cancel --repo "${repo}" "${id}"
done
'''

# --- supply chain ----------------------------------------------------------
[tasks.scorecard]
alias = ["sco"]
description = "Score supply-chain health with OpenSSF Scorecard"
# Extra flags pass straight through, e.g. `mise run sco --checks=Binary-Artifacts`.
run = '''
#!/usr/bin/env bash

set -eo pipefail

# `scorecard --local` walks the filesystem directly and has NO exclude/ignore
# flag, so pointing it at the repo root scans build/ and build/DerivedData
# (gigabytes of build output) and scores Binary-Artifacts 0/10 on compiled
# dependencies. Mirror only the tracked files into a scratch tree instead:
# `git ls-files` IS the exclusion mechanism, since a path .gitignore excludes is
# never tracked and so can never reach the scan. Local mode runs the
# filesystem-based checks; the history/API ones are skipped either way, so the
# tree needs no .git.
#
# Copy working-tree content (not `git checkout-index`, which reads the index)
# so an edit you have not staged yet is what actually gets scored.
root="$(git rev-parse --show-toplevel)"
out="${SCORECARD_OUTPUT:-$root/scorecard.json}"

tree="$(mktemp -d)"
raw="$(mktemp)"
trap 'rm -rf "$tree" "$raw"' EXIT

while IFS= read -r -d '' f; do
  [ -f "$root/$f" ] || [ -L "$root/$f" ] || continue
  mkdir -p "$tree/$(dirname "$f")"
  cp -Pp "$root/$f" "$tree/$f"
done < <(git -C "$root" ls-files -z)

eval "args=(${usage_args:-})"

# A filtered run (--checks=...) produces a partial report whose aggregate score
# is computed from only those checks — writing that over scorecard.json makes a
# single 10/10 check look like a perfect overall score. Send filtered runs to a
# separate file so the canonical report is always a complete scan.
# Tested against usage_args rather than the array length: mise renders run
# blocks as tera templates, and bash's ${#array[@]} opens a tera comment (`{#`),
# which fails the task with "Closing comment tag `#}` not found".
if [ -n "${usage_args:-}" ]; then
  out="${out%.json}.partial.json"
fi

scorecard \
  --local="$tree" \
  --format json \
  --show-details \
  --show-annotations \
  --output "$raw" \
  "${args[@]}"

# scorecard reports the directory it was pointed at, so --local leaves the
# scratch mirror's mktemp path in .repo.name and cannot resolve .repo.commit at
# all. Restore the real identity; mark it -dirty because the scan copies
# working-tree content, which by definition may differ from HEAD.
name="$(git -C "$root" remote get-url origin 2>/dev/null || basename "$root")"
commit="$(git -C "$root" rev-parse HEAD 2>/dev/null || echo unknown)"
if [ -n "$(git -C "$root" status --porcelain)" ]; then
  commit="$commit-dirty"
fi

jq --arg name "$name" --arg commit "$commit" \
  '.repo.name = $name | .repo.commit = $commit' "$raw" > "$out"

echo "wrote $out ($(jq '.checks | length' "$out") checks, score $(jq '.score' "$out"))"
'''
shell = "bash -c"
usage = 'arg "[args]" var=#true help="extra scorecard flags, e.g. --checks=Binary-Artifacts"'
