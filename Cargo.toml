[workspace]
exclude = []
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Elio Severo Junior <elioseverojunior@gmail.com>"]
categories = []
description = ""
documentation = "https://docs.rs/comply"
edition = "2024"
keywords = []
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/elioseverojunior/comply"
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = "deny"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
warnings = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
collapsible_if = "allow"
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = { version = ">=1.0,<2.0.0" }
chrono = { version = ">=0.4,<1.0.0", default-features = false, features = [
  "now",
  "std",
] }
clap = { version = ">=4.6,<5.0.0", features = ["derive"] }
comply = { path = "crates/comply", version = "0.1.0" }
comply-cli = { path = "crates/comply-cli", version = "0.1.0" }
ignore = { version = ">=0.4,<1.0.0" }
regex = { version = ">=1.13,<2.0.0" }
serde = { version = ">=1.0,<2.0.0", features = ["derive"] }
serde_json = { version = ">=1,<2.0.0" }
sha2 = { version = ">=0.11,<1.0.0" }
tempfile = { version = ">=3.27,<4.0.0", features = [] }
thiserror = { version = ">=2.0,<3.0.0" }
toml = { version = ">=1.1,<2.0.0" }
walkdir = { version = ">=2.5,<3.0.0" }
# Pinned once so every crate that binds to JS/WASM shares one version.
wasm-bindgen = { version = ">=0.2,<1" }
