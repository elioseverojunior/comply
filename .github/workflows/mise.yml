name: Mise

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# Paths are the UNION of what the two jobs depend on, because `on: paths` is
# scoped to the workflow, not to a job -- one list has to serve both.
#
# `setup` only cares about mise.toml/mise.lock: Cargo files cannot change whether
# a pinned tool installs. `coverage-llvm-cov` cares about every `.rs` file, since
# that is what moves the ratchet -- filtered to manifests alone it would never
# fire on an ordinary source commit, and would read green because it never ran.
# The union keeps coverage correct at the cost of running `setup` more often than
# strictly needed; those are cached installs, so the trade is cheap.
#
# `.cargo/config.toml` and `rust-toolchain.toml` are here because both change
# codegen, and this repo has already seen coverage attribution move with them.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/mise.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/mise.yml"
  workflow_dispatch:
  # Keeps the Actions caches warm. Two things make this worth a weekly run:
  # GitHub evicts any cache not ACCESSED in 7 days (a restore counts, so this
  # need not write anything), and setup-rust-env's cargo-bin key ends in the ISO
  # week, so it rotates every Monday by design. Without this the first push after
  # the rollover pays the full tool install (~2m45s measured); 06:00 Monday moves
  # that cost off a person's push.
  #
  # On main deliberately: a cache written here is readable from every branch,
  # while a cache written on a branch never helps another one.
  schedule:
    - cron: "0 6 * * 1"

# Top-level read-all; jobs that upload results need additional write permissions.
permissions: read-all

env:
  CARGO_TERM_COLOR: always
  # mise.toml's [env] defaults GITHUB_TOKEN to '' when unset, and an empty token
  # sends cargo-binstall down the unauthenticated, rate-limited path.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
  # Only affects `mise run`, not the `mise install` the setup job exists to do.
  # cargo-llvm-cov now arrives prebuilt via setup-rust-env, so the coverage task
  # has no reason to provision anything itself.
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  # The only place in CI that runs `mise install` -- every other mise-action call
  # passes `install: false`. This is what proves [tools] and mise.lock still
  # resolve; nothing else would catch a broken tool pin.
  setup:
    name: Tool manifest installs
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - uses: ./.github/actions/setup-rust-env
        id: rust-env

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_key: mise-${{ steps.rust-env.outputs.cache-key }}

  # The second engine, held to a ratchet rather than to 100.
  #
  # tarpaulin in ci.yml remains the gate of record at 100%. llvm-cov cannot be
  # held there -- its region and function metrics fall short on `?` error edges
  # and assert branches that no test can execute -- but pinning it to 100 anyway
  # made this job red on every single run, which is no signal at all: a job that
  # is always failing cannot tell you when something broke.
  #
  # 97 sits just under today's floor (regions 98.93, functions 98.00, lines
  # 99.74), so the job is green now and turns red only on a real regression.
  # Raise it as the numbers improve. No `continue-on-error`: with an achievable
  # threshold, a failure here means something actually went wrong.
  coverage-llvm-cov:
    name: Coverage (llvm-cov ratchet)
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    needs: [setup]
    # Not on the schedule. That run exists to touch the caches, and `setup` above
    # already does it by going through setup-rust-env; a full instrumented build
    # on top would make a cheap warmer expensive and turn any coverage regression
    # into a 06:00 Monday alarm about something the push-triggered run already
    # gates. Keeping it out means a red scheduled run means a cache problem.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - uses: ./.github/actions/setup-rust-env
        id: rust-env

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_key: mise-${{ steps.rust-env.outputs.cache-key }}
          install: false

      # `coverage:llvm`, not `coverage`: the latter is an alias for
      # `coverage:tarpaulin` (mise.toml), so this job ran the wrong engine --
      # gating tarpaulin at 97 instead of the 100 ci.yml already enforces, and
      # pulling a nightly toolchain for doctest coverage that llvm-cov does not
      # need. That download is what failed here, reproducibly.
      - run: mise run coverage:llvm -t 97
