name: Mise

concurrency:
  group: mise-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Top-level read-all; jobs that upload results need additional write permissions.
permissions: read-all

jobs:
  setup:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust-env
        id: rust-env

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_key: mise-${{ steps.rust-env.outputs.cache-key }}

  lint:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    needs: [setup]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust-env
        id: rust-env

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_key: mise-${{ steps.rust-env.outputs.cache-key }}
          install: false
      - run: |
          mise run cargo-sort
          mise run taplo
          mise run fmt

  test:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    needs: [setup]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust-env
        id: rust-env

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache_key: mise-${{ steps.rust-env.outputs.cache-key }}
          install: false

      - run: |
          mise run coverage
