name: Publish

# A LITERAL name, not `${{ github.workflow }}`. In a called workflow that
# expression resolves to the CALLER's name, so this rendered as `CI-main` -- the
# same group ci.yml holds -- and the call deadlocked against its own caller:
# "Canceling since a deadlock was detected for concurrency group: 'CI-main'
# between a top level workflow and 'Publish'". A fixed prefix cannot collide with
# the caller's group however this workflow is reached.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# One workflow, because these jobs must be ORDERED. Packaging, provenance,
# signing and publishing used to be split across publish.yml and
# crates-publish.yml, and `needs:` does not reach across workflows -- so the
# crates.io publish could not depend on the artefacts being attested and signed.
# It fired on `release: published` while the signing fired on the tag push, and
# nothing sequenced the two. A crate could reach crates.io whether or not its
# provenance had been generated.
#
# Reachability is the other half, and it is why `workflow_call` exists below:
# neither `push: tags` nor `release: published` fires for an automated release,
# because ci.yml raises both with GITHUB_TOKEN and GitHub suppresses
# workflow-triggering events from that token. Those triggers serve a human
# pushing a tag; ci.yml calls this workflow directly.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Perform a dry run without publishing"
        required: false
        type: boolean
        default: false
  # Called directly by ci.yml rather than waiting on the tag it pushes. A tag
  # pushed with GITHUB_TOKEN does not create a workflow run -- GitHub suppresses
  # events raised by that token to stop workflows retriggering themselves -- so
  # `push: tags` below never fires for an automated release and this whole
  # pipeline was unreachable. `workflow_call` expresses the dependency
  # structurally instead, with no long-lived PAT to hold it together.
  #
  # `push: tags` is kept for a tag pushed by a human, which does raise the event.
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: false
        type: string
      dry_run:
        description: "Perform a dry run without publishing"
        required: false
        type: boolean
        default: false

# NOT `read-all`. This workflow is called (publish.yml calls github-pages-docs.yml,
# and ci.yml calls publish.yml), and a
# called workflow cannot request more than the calling JOB grants. `read-all`
# expands to read on every scope there is -- attestations, discussions, models,
# packages, statuses and a dozen more -- so the call failed with "The workflow is
# requesting 'artifact-metadata: read, attestations: read, ...' but is only
# allowed". Every job that needs more than this declares it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Release
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      # From the tag, not `github.event.release.tag_name`: this no longer runs on
      # the `release` event, so that field is empty here.
      - name: Extract version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version to publish: ${VERSION}"

      - name: Check if should publish
        id: check
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run mode - will not publish"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Will proceed with publishing"
          fi

  package:
    name: Package crates
    needs: [validate]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - uses: ./.github/actions/setup-rust-env
        with:
          cargo-tools: ""

      - name: Package crates
        run: |
          mkdir -p dist
          # Neither `--no-verify` nor `--allow-dirty`. `--no-verify` skips the
          # build check, so a crate that does not compile could still be
          # packaged, hashed, attested and signed -- attesting to an artefact
          # nothing had built. `--allow-dirty` hid a tree that did not match the
          # tagged commit, which would have signed a tarball for a state no
          # commit describes. At a tag both should hold, so a failure here is
          # real news.
          cargo package --workspace
          cp target/package/*.crate dist/

      - name: Compute hashes
        id: hash
        working-directory: dist
        run: echo "hashes=$(sha256sum ./*.crate | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates
          path: dist/*.crate

  provenance:
    name: SLSA L3 provenance
    needs: [package]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.package.outputs.hashes }}
      # The repository is PUBLIC (`gh api repos/... -q .private` -> false), but the
      # generator halted with "Repository is private. The workflow has halted in
      # order to keep the repository name from being exposed in the public
      # transparency log." It reads `github.event.repository.private`, which a
      # `workflow_call` does not populate the way a directly-triggered run does,
      # and treats absent as private.
      #
      # So this override says "publish to Rekor anyway", which is what a public
      # repo wants. Nothing is leaked that is not already published: Cargo.toml's
      # `repository` field carries this exact URL to crates.io.
      #
      # If the repo is ever made private, revisit -- the guard exists for a real
      # reason and this flag switches it off.
      # Only on a tag. `upload-assets` attaches the attestation to the Release
      # for the CURRENT ref, and ci.yml calls this workflow on a push to main --
      # where `github.ref` is `refs/heads/main` and no release exists. The
      # generator has no guard for that and failed its `final` job with exit 27
      # (`SUCCESS: false`), taking the whole publish chain down with it.
      #
      # On a tag push the release does exist, so the attestation attaches as
      # intended. Off a tag the provenance is still generated and still available
      # as a workflow artifact -- only the release upload is skipped.
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      private-repository: true

  sign:
    name: Sigstore signing
    needs: [package]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crates
          path: dist

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign crates (keyless OIDC)
        run: |
          for f in dist/*.crate; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: dist/*.cosign.bundle

      # A workflow artifact is not a release asset: it expires, and it is
      # reachable only by navigating to the run. Signatures kept there cannot be
      # used -- nobody can `cosign verify-blob` an artefact they cannot find, so
      # the signing ran, passed, and produced nothing usable. The provenance job
      # already attaches its attestation via `upload-assets: true`; this is the
      # same idea for the bundles.
      #
      # Skipped when no Release exists for the tag (a `workflow_call` from ci.yml
      # can outrun release creation), so a missing Release does not fail signing
      # that otherwise succeeded.
      - name: Attach signatures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.cosign.bundle --clobber
            set -- dist/*.cosign.bundle
            echo "Attached $# bundle(s) to ${TAG}"
          else
            echo "::warning::No release for ${TAG}; bundles remain as the 'signatures' artifact"
          fi

  publish-crates:
    name: Publish crates to crates.io
    # The whole point of the merge: publishing now waits on provenance AND
    # signing. Across two workflows this dependency could not be expressed, so
    # crates reached the registry unattested whenever the signing job was slower,
    # failed, or never ran.
    #
    # No job-level `if` on should_publish: a dry run has to REACH here, or it
    # verifies nothing. Only the two steps that touch the registry are gated.
    needs: [validate, provenance, sign]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: GitHub Actions Bot Setup
        uses: ./.github/actions/bot-setup

      # `cargo package`/`cargo publish` build each crate to verify it, so they
      # need mold from setup-rust-env; the bare toolchain action left it out and
      # the verify step would fail at link time.
      - uses: ./.github/actions/setup-rust-env
        with:
          cargo-tools: ""

      # Runs either way -- proving both crates package is what a dry run is FOR.
      - name: Verify packages
        run: cargo package --workspace --verbose

      # Gated: a dry run should not mint a registry token it will not use.
      - name: Crates.io Authentication
        id: crates-auth
        if: needs.validate.outputs.should_publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--workspace` resolves the publish order from the dependency graph and
      # polls the index between crates, so neither has to be maintained here.
      - name: Publish to crates.io
        if: needs.validate.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --workspace --token "${CARGO_REGISTRY_TOKEN}" --verbose

      - name: Dry run verification
        if: needs.validate.outputs.should_publish != 'true'
        run: echo "Dry run -- crates packaged and verified, provenance and signing exercised, nothing published."

  # Publishes the VitePress site. A job-level `uses:`, not a step: a step cannot
  # call a workflow, which is what the previous version of this job attempted.
  # The only docs publisher. A `publish-docs` job used to deploy rustdoc through
  # the Pages ARTIFACT path, which this repo cannot serve -- Pages reads the
  # `gh-pages` branch. The developer-facing API reference is docs.rs's job, built
  # automatically on crates.io publish; this one is the user-facing site.
  gh-pages-docs:
    name: Publish docs site
    # `validate` is required, not decorative: the `if` below reads
    # `needs.validate.outputs`, and outputs are readable only from jobs listed
    # here. With `publish-crates` alone it is undefined, which reads as false --
    # so the docs publish would skip on every release without ever failing.
    needs: [validate, publish-crates]
    if: needs.validate.outputs.should_publish == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages-docs.yml
    secrets: inherit
    # Required, not optional: github-pages-docs.yml's `publish` job gates on `inputs.publish`
    # and defaults it to false, so calling without this builds the site and
    # deploys nothing.
    with:
      publish: ${{ !inputs.dry_run }}
      # Declared `required` by that workflow, which uses it only to print the
      # docs.rs URL in its summary. `validate` already resolved it.
      version: ${{ needs.validate.outputs.version }}

  summary:
    name: Publish Summary
    needs: [validate, package, provenance, sign, publish-crates, gh-pages-docs]
    if: always()
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          PROVENANCE: ${{ needs.provenance.result }}
          SIGN: ${{ needs.sign.result }}
          CRATES: ${{ needs.publish-crates.result }}
          DOCS: ${{ needs.gh-pages-docs.result }}
        run: |
          set -eo pipefail

          {
            echo "# Publish Summary"
            echo ""
            echo "**Version:** ${VERSION}"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| SLSA provenance | ${PROVENANCE} |"
            echo "| Sigstore signing | ${SIGN} |"
            echo "| crates.io | ${CRATES} |"
            echo "| Documentation | ${DOCS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${CRATES}" = "success" ]; then
            echo "- crates.io: https://crates.io/crates/comply/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${CRATES}" = "skipped" ]; then
            echo "- crates.io: skipped (dry run)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${DOCS}" = "success" ]; then
            echo "- docs.rs: https://docs.rs/comply/latest" >> "$GITHUB_STEP_SUMMARY"
            echo "- GitHub Pages: https://${OWNER}.github.io/comply/" >> "$GITHUB_STEP_SUMMARY"
          fi
