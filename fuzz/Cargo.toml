[package]
edition = "2024"
name = "comply-fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace, deliberately. The root workspace denies `unsafe_code` and
# treats warnings as errors; `fuzz_target!` expands to an `unsafe extern "C"`
# entry point, so a fuzz crate can never satisfy those lints. Keeping it out
# also keeps `cargo package --workspace` and the coverage gate unaware of it.
[workspace]
members = ["."]

[dependencies]
# `default-features = false`: the fuzz targets exercise library entry points,
# so pulling in `cli` would build clap and anyhow on every fuzz run for nothing.
# This is a direct dependency rather than a workspace-inherited one -- fuzz is
# its own workspace -- so the opt-out takes effect where it is written.
comply = { path = "../crates/comply", default-features = false }
libfuzzer-sys = "0.4"

[[bin]]
bench = false
doc = false
name = "spdx_parse"
path = "fuzz_targets/spdx_parse.rs"
test = false
