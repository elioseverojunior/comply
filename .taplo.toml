# taplo walks the whole tree and does NOT read .gitignore, so without this the
# gate fails on files no one wrote:
#   * `target/**` -- `cargo package` and `cargo semver-checks` both synthesise a
#     Cargo.toml there, formatted by cargo rather than by taplo. Running either,
#     then `taplo:check`, failed the gate until `target/` was cleaned.
#   * `.worktrees/**` -- a full second copy of the repo (AGENTS.md puts feature
#     branches there), so in-progress TOML on one branch failed the gate on
#     another.
#   * `node_modules/**` -- vendored packages, not ours to format.
#
# `**/target/**` rather than `target/**`: it has to catch `fuzz/target/` too,
# which is a separate cargo workspace.
exclude = ["**/target/**", "**/node_modules/**", ".worktrees/**"]

[formatting]
# taplo pads trailing comments into a column, cargo-sort emits a single space,
# and each rewrites what the other just wrote -- so `cargo:sort:check` and
# `taplo:check` could never both pass on a file with inline comments (see
# crates/comply/Cargo.toml's [features]). taplo is the formatter of record, so
# it yields on this one point rather than the two fighting forever.
align_comments = false
indent_string = "  "
indent_table = true
reorder_keys = true

[schema]
# Cargo.toml uses [lints.rust] which the SchemaStore schema doesn't recognize.
# Disable schema validation to suppress false-positive warnings.
enabled = false
