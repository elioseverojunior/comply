SPDX-FileCopyrightText = "COMPLY contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
SPDX-PackageDownloadLocation = "https://github.com/elioseverojunior/comply"
SPDX-PackageName = "comply"
SPDX-PackageSupplier = "COMPLY contributors"
version = 1

[[annotations]]
SPDX-FileCopyrightText = "COMPLY contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
path = ["**"]
precedence = "aggregate"

[[annotations]]
SPDX-License-Identifier = "CC-BY-3.0"
path = ["DCO.txt"]
precedence = "aggregate"

[tool.comply]
# Custom comply settings
ignore = [
  "**/*.ico",
  "**/*.lock",
  "**/*.png",
  "**/*.svg",
  "**/.actrc",
  "**/.aider.*/",
  "**/.bun-version",
  "**/.nvmrc",
  "**/.prettierignore",
  "**/.prettierrc",
  "**/.remember/",
  "**/.rumdl_cache/",
  "**/CHANGELOG.md",
  "**/RELEASE_NOTE*.md",
  "**/bench-report/",
  "**/benchmarks.json",
  "**/committed.toml",
  "**/dist/",
  "**/docker/Dockerfile*",
  "**/docs/benchmarks/latest.md",
  "**/docs/index.md",
  "**/favicon*",
  "**/mutants*/",
  "**/package*.json",
  "**/package.json",
  "**/supply-chain/.cargo-vet/**",
  "**/target/**",
  "**/tsconfig*.json",
  "DCO.txt",
  "crates/*/LICENSE-*",
]

[[tool.comply.comment-styles]]
close = ""
filenames = [".gitmessage"]
line = ""
open = "#"

[[tool.comply.comment-styles]]
close = ""
extensions = ["pkl"]
filenames = ["hk.pkl"]
line = ""
open = "//"
